summary: 'Alerts: Fetch alerts from Google Cloud Storage'
description: Download new remote sensing alerts put into GCS by a partner
lock: '!inline f/connectors/alerts/alerts_gcs.script.lock'
concurrency_time_window_s: 0
kind: script
schema:
  $schema: 'https://json-schema.org/draft/2020-12/schema'
  type: object
  order:
    - gcp_service_acct
    - alerts_bucket
    - alerts_provider
    - territory_id
    - db
    - destination_action
    - existing_db_table_name
    - db_table_name
    - destination_path
    - max_months_lookback
  properties:
    alerts_bucket:
      type: string
      description: The name of the Google Cloud Storage bucket where the alerts are stored.
      default: null
      originalType: string
    alerts_provider:
      type: string
      description: The name of the alerts provider.
      default: null
      originalType: string
    db:
      type: object
      description: The database connection parameters for storing tabular data.
      default: null
      format: resource-postgresql
    destination_action:
      type: string
      description: >-
        Enter a dataset name, or choose an existing dataset.
        Creates the dataset if needed; updates it if it already exists.
      default: create_new_dataset
      disableCreate: true
      enum:
        - create_new_dataset
        - use_existing_dataset
      enumLabels:
        create_new_dataset: Enter dataset name
        use_existing_dataset: Use existing dataset
      originalType: enum
      title: Dataset
    existing_db_table_name:
      type: object
      description: >-
        Existing public table to write into. The list refreshes from `db`
        and omits connector sidecar tables (`__columns`, `__labels`,
        `__metadata`).
      default: null
      format: dynselect-existing_db_table_name
      nullable: true
      showExpr: "fields.destination_action == 'use_existing_dataset'"
      title: Existing dataset
    db_table_name:
      type: string
      description: >-
        Creates the dataset if needed; updates it if it already exists.
        The summary is saved in `{name}__metadata`.
      default: null
      nullable: true
      originalType: string
      pattern: '^.{1,53}$'
      showExpr: "fields.destination_action != 'use_existing_dataset'"
      title: Dataset name
    destination_path:
      type: string
      description: >-
        A string specifying the local directory path where files will be
        downloaded and processed.
      default: /persistent-storage/datalake/change_detection/alerts
      originalType: string
    gcp_service_acct:
      type: object
      description: >-
        Google Cloud service account credentials. This should reference the
        contents of a `service.json` file provided by the alerts publisher. For
        more information on setting up and retrieving GCP credentials, see:
        https://cloud.google.com/docs/authentication/provide-credentials-adc#on-prem
      default: null
      format: resource-gcp_service_account
    max_months_lookback:
      type: integer
      description: >-
        Maximum number of months to look back when processing alerts. Only
        alerts from the last N months will be downloaded and processed. This
        helps bound memory usage when dealing with large historical datasets. If
        null or not specified, all historical data will be processed.
      default: null
    territory_id:
      type: integer
      description: >-
        The territory ID (areas of interest) for which change detection alerts
        will be retrieved. This ID is used to filter and process relevant
        alerts.
      default: null
  required:
    - gcp_service_acct
    - alerts_bucket
    - alerts_provider
    - territory_id
    - db
