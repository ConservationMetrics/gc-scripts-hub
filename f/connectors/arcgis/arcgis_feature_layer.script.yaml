summary: 'ArcGIS: Download Feature Layer (i.e. Survey123)'
description: >-
  This script fetches the contents of an ArcGIS feature layer (such as
  submissions from Survey123) and stores it in a PostgreSQL database.
lock: '!inline f/connectors/arcgis/arcgis_feature_layer.script.lock'
concurrency_time_window_s: 0
kind: script
schema:
  $schema: 'https://json-schema.org/draft/2020-12/schema'
  type: object
  order:
    - arcgis_account
    - feature_layer_url
    - db
    - destination_action
    - existing_db_table_name
    - db_table_name
    - attachment_root
  properties:
    arcgis_account:
      type: object
      description: The name of the ArcGIS account to use for fetching the feature layer.
      default: null
      format: resource-arcgis_account
      originalType: string
    attachment_root:
      type: string
      description: >-
        A path where ArcGIS attachments (e.g., from Survey123) will be stored.
        Attachment  files like photo and audio will be stored in the following
        directory schema:  `{attachment_root}/{db_table_name}/attachments/...`
      default: /persistent-storage/datalake
      originalType: string
    db:
      type: object
      description: A database connection for storing tabular data.
      default: null
      format: resource-postgresql
    destination_action:
      type: string
      description: >-
        Write into a table that already exists, or create a new one.
        Choosing an existing dataset avoids a typo creating a second table.
      default: create_new_dataset
      disableCreate: true
      enum:
        - use_existing_dataset
        - create_new_dataset
      enumLabels:
        use_existing_dataset: Use existing dataset
        create_new_dataset: Create new dataset
      originalType: enum
      title: Dataset
    existing_db_table_name:
      type: object
      description: >-
        Existing table to write into; also used as the datalake subdirectory.
        The list refreshes from `db` and omits connector sidecar tables
        (`__columns`, `__labels`, `__metadata`).
      default: null
      format: dynselect-existing_db_table_name
      nullable: true
      showExpr: "fields.destination_action == 'use_existing_dataset'"
      title: Existing dataset
    db_table_name:
      type: string
      description: >-
        Name of the new database table where the data will be stored.
        Also used as the datalake subdirectory.
      default: null
      nullable: true
      originalType: string
      pattern: '^.{1,54}$'
      showExpr: "fields.destination_action != 'use_existing_dataset'"
      title: New dataset name
    feature_layer_url:
      type: string
      description: The URL of the ArcGIS feature layer to fetch.
      default: null
      originalType: string
  required:
    - arcgis_account
    - feature_layer_url
    - db
