summary: 'iNaturalist: Fetch My Observations'
description: >-
  Uses the iNaturalist REST API to download public observations for a given
  username, saving results as GeoJSON to the datalake and PostgreSQL.
lock: '!inline f/connectors/inaturalist/inaturalist_pull_my_observations.script.lock'
concurrency_time_window_s: 0
kind: script
schema:
  $schema: 'https://json-schema.org/draft/2020-12/schema'
  type: object
  order:
    - username
    - db
    - db_table_name
    - attachment_root
  properties:
    attachment_root:
      type: string
      description: >-
        A path where iNaturalist data files will be stored. Files will be stored
        as: `{attachment_root}/{db_table_name}/...`
      default: /persistent-storage/datalake
      originalType: string
    db:
      type: object
      description: A database connection for storing tabular data.
      default: null
      format: resource-postgresql
    db_table_name:
      type: string
      description: The name of the database table where observations will be stored.
      default: null
      originalType: string
      pattern: '^.{1,54}$'
    username:
      type: string
      description: >-
        The iNaturalist username (profile slug), found in the profile URL
        (https://www.inaturalist.org/people/{username}).
      default: null
      originalType: string
  required:
    - username
    - db
    - db_table_name
