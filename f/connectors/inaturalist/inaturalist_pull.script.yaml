summary: 'iNaturalist: Fetch Project Observations'
description: >-
  Uses the iNaturalist REST API to download public project observations,
  saving results as GeoJSON to the datalake and PostgreSQL.
lock: '!inline f/connectors/inaturalist/inaturalist_pull.script.lock'
concurrency_time_window_s: 0
kind: script
schema:
  $schema: 'https://json-schema.org/draft/2020-12/schema'
  type: object
  order:
    - project_id
    - db
    - db_table_name
    - attachment_root
  properties:
    attachment_root:
      type: string
      description: >-
        A path where iNaturalist data files will be stored. Files will be stored
        as: `{attachment_root}/{db_table_name}/...`
      default: /persistent-storage/datalake
      originalType: string
    db:
      type: object
      description: A database connection for storing tabular data.
      default: null
      format: resource-postgresql
    db_table_name:
      type: string
      description: The name of the database table where observations will be stored.
      default: null
      originalType: string
      pattern: '^.{1,54}$'
    project_id:
      type: string
      description: >-
        The iNaturalist project numeric ID or slug, found in the project URL
        (https://www.inaturalist.org/projects/{slug} or
        https://www.inaturalist.org/projects/{id}).
      default: null
      originalType: string
  required:
    - project_id
    - db
    - db_table_name
