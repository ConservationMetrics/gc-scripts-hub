summary: "iNaturalist: Fetch Observations"
description: >-
  Uses the iNaturalist API to download public observations for a project,
  user, and/or geographic bounding box, saving GeoJSON and photo/sound
  attachments to the datalake and PostgreSQL. At least one of `slug` or
  `bounding_box` must be provided.
lock: "!inline f/connectors/inaturalist/inaturalist_pull.script.lock"
concurrency_time_window_s: 0
kind: script
schema:
  $schema: "https://json-schema.org/draft/2020-12/schema"
  type: object
  order:
    - slug
    - source
    - bounding_box
    - db
    - db_table_name
    - attachment_root
  properties:
    attachment_root:
      type: string
      description: >-
        A path where iNaturalist data files will be stored. Files will be stored
        as: `{attachment_root}/{db_table_name}/...`
      default: /persistent-storage/datalake
      originalType: string
    db:
      type: object
      description: A database connection for storing tabular data.
      default: null
      format: resource-postgresql
    db_table_name:
      type: string
      description: The name of the database table where observations will be stored.
      default: null
      originalType: string
      pattern: "^.{1,54}$"
    bounding_box:
      type: string
      description: >-
        Optional viewport bounds as a JSON list of two corners,
        `[[west, south], [east, north]]` (longitude, latitude). When supplied with
        `slug`, both filters are applied to the same query. Copy bounds from
        Mapbox Location Helper:
        https://labs.mapbox.com/location-helper/
      default: null
      originalType: string
      pattern: '^(|\[\s*\[\s*-?[0-9]+(\.[0-9]+)?\s*,\s*-?[0-9]+(\.[0-9]+)?\s*\]\s*,\s*\[\s*-?[0-9]+(\.[0-9]+)?\s*,\s*-?[0-9]+(\.[0-9]+)?\s*\]\s*\])$'
    slug:
      type: string
      description: >-
        Optional. When source is "project": the project numeric ID or slug
        (https://www.inaturalist.org/projects/{slug}). When source is "user":
        the username (https://www.inaturalist.org/people/{username}). Either
        `slug` or `bounding_box` must be provided.
      default: null
      originalType: string
    source:
      type: string
      description: >-
        Whether `slug` identifies a project ("project") or a username
        ("user"). Required when `slug` is provided; unused for bounding-box-only
        pulls.
      default: null
      enum:
        - project
        - user
      originalType: string
  required:
    - db
    - db_table_name
