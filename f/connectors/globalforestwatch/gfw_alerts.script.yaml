summary: 'Global Forest Watch: Fetch Alerts'
description: Fetch alerts from the Global Forest Watch API
lock: '!inline f/connectors/globalforestwatch/gfw_alerts.script.lock'
concurrency_time_window_s: 0
kind: script
schema:
  $schema: 'https://json-schema.org/draft/2020-12/schema'
  type: object
  order:
    - type_of_alert
    - gfw
    - bounding_box
    - max_months_lookback
    - db
    - destination_action
    - existing_db_table_name
    - db_table_name
    - attachment_root
  properties:
    attachment_root:
      type: string
      description: >-
        A path where a GeoJSON file will be stored. This is used for storing the
        alerts in a GeoJSON format.
      default: /persistent-storage/datalake
      originalType: string
    bounding_box:
      type: string
      description: >-
        A bounding box defining the geographical area of interest for fetching
        alerts. This should be a list of coordinates forming a closed polygon,
        for example: 
        `[[[-55.2308,5.6945],[-55.2158,5.6945],[-55.2158,5.7055],[-55.2308,5.7055],[-55.2308,5.6945]]]`
      default: null
      originalType: string
    db:
      type: object
      description: The database connection parameters for storing tabular data.
      default: null
      format: resource-postgresql
    destination_action:
      type: string
      description: >-
        Enter a dataset name, or choose an existing dataset.
        Creates the dataset if needed; updates it if it already exists.
      default: create_new_dataset
      disableCreate: true
      enum:
        - create_new_dataset
        - use_existing_dataset
      enumLabels:
        create_new_dataset: Enter dataset name
        use_existing_dataset: Use existing dataset
      originalType: enum
      title: Dataset
    existing_db_table_name:
      type: object
      description: >-
        Existing table to write into; also used as the datalake subdirectory.
        The list refreshes from `db` and omits connector sidecar tables
        (`__columns`, `__labels`, `__metadata`).
      default: null
      format: dynselect-existing_db_table_name
      nullable: true
      showExpr: "fields.destination_action == 'use_existing_dataset'"
      title: Existing dataset
    db_table_name:
      type: string
      description: >-
        Creates the dataset if needed; updates it if it already exists.
        Also used as the datalake subdirectory.
      default: null
      nullable: true
      originalType: string
      pattern: '^.{1,54}$'
      showExpr: "fields.destination_action != 'use_existing_dataset'"
      title: Dataset name
    gfw:
      type: object
      description: >-
        The API key for accessing the Global Forest Watch API. Please note that 
        this year expires after 1 year. For now, you can obtain a new API key
        from  the Global Forest Watch API.
      default: null
      format: resource-gfw
    max_months_lookback:
      type: integer
      description: >-
        Number of months to look back when fetching alerts. For example, if set
        to 6, the script will fetch alerts from the last 6 months. This
        determines both the API query date range and the metadata records
        created.
      default: null
    type_of_alert:
      type: string
      description: >-
        The type of alert to fetch from the Global Forest Watch API. This can be
        one of the following:  `gfw_integrated_alerts` (recommended), 
        `nasa_viirs_fire_alerts`, `gfw_radd_alerts`, `umd_glad_landsat_alerts`, 
        or `umd_glad_sentinel2_alerts.
      default: null
      enum:
        - gfw_integrated_alerts
        - gfw_radd_alerts
        - nasa_viirs_fire_alerts
        - umd_glad_landsat_alerts
        - umd_glad_sentinel2_alerts
      originalType: string
  required:
    - gfw
    - bounding_box
    - type_of_alert
    - max_months_lookback
    - db
