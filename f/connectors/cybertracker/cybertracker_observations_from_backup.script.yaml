summary: "CyberTracker: Import Observations From Backup"
description: ""
lock: "!inline f/connectors/cybertracker/cybertracker_observations_from_backup.script.lock"
concurrency_time_window_s: 0
kind: script
schema:
  $schema: "https://json-schema.org/draft/2020-12/schema"
  type: object
  order:
    - cybertracker_observations_path
    - db
    - destination_action
    - existing_db_table_name
    - db_table_name
    - attachment_root
  properties:
    attachment_root:
      type: string
      description: >-
        The path where the data is stored in Guardian Connector.
      default: /persistent-storage/datalake
      originalType: string
    db:
      type: object
      description: A database connection for storing tabular data.
      default: null
      format: resource-postgresql
    destination_action:
      type: string
      description: >-
        Enter a dataset name, or choose an existing dataset.
        Creates the dataset if needed; updates it if it already exists.
      default: create_new_dataset
      disableCreate: true
      enum:
        - create_new_dataset
        - use_existing_dataset
      enumLabels:
        create_new_dataset: Enter dataset name
        use_existing_dataset: Use existing dataset
      originalType: enum
      title: Dataset
    existing_db_table_name:
      type: object
      description: >-
        Existing table to write into; also used as the datalake subdirectory.
        The list refreshes from `db` and omits connector sidecar tables
        (`__columns`, `__labels`, `__metadata`).
      default: null
      format: dynselect-existing_db_table_name
      nullable: true
      showExpr: "fields.destination_action == 'use_existing_dataset'"
      title: Existing dataset
    db_table_name:
      type: string
      description: >-
        Creates the dataset if needed; updates it if it already exists.
        Also used as the datalake subdirectory.
      default: null
      nullable: true
      originalType: string
      pattern: "^.{1,54}$"
      showExpr: "fields.destination_action != 'use_existing_dataset'"
      title: Dataset name
    cybertracker_observations_path:
      type: string
      description: >-
        The path (in attachment root) to the CyberTracker observations JSON file to import,
        e.g. "my_cybertracker_backup/data/0.json".
      default: null
      originalType: string
      pattern: \.json$

  required:
    - cybertracker_observations_path
    - db
