summary: 'CoMapeo: Post Alerts'
description: >-
  This script fetches alerts data from a database and posts it to a CoMapeo
  server.
lock: '!inline f/connectors/comapeo/comapeo_alerts.script.lock'
concurrency_time_window_s: 0
kind: script
schema:
  $schema: 'https://json-schema.org/draft/2020-12/schema'
  type: object
  order:
    - db
    - db_table_name
    - comapeo
    - comapeo_projects
  properties:
    comapeo:
      type: object
      description: >-
        A server URL and access token pair to connect to a CoMapeo archive
        server.
      default: null
      format: resource-comapeo_server
    comapeo_projects:
      type: array
      description: >-
        Project IDs on the CoMapeo server where the alerts will be posted.
      default: null
      items:
        type: string
      originalType: string[]
    db:
      type: object
      description: A database connection for fetching alerts data.
      default: null
      format: resource-postgresql
    db_table_name:
      type: object
      description: >-
        Existing public table to read alerts from. The list refreshes from
        `db` and omits connector sidecar tables (`__columns`, `__labels`,
        `__metadata`).
      default: null
      format: dynselect-db_table_name
      nullable: true
      title: Dataset
  required:
    - db
    - db_table_name
    - comapeo
    - comapeo_projects
