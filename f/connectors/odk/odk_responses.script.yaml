summary: 'ODK: Fetch Survey Responses'
description: Uses PyODK to download all form submissions
lock: '!inline f/connectors/odk/odk_responses.script.lock'
concurrency_time_window_s: 0
kind: script
schema:
  $schema: 'https://json-schema.org/draft/2020-12/schema'
  type: object
  order:
    - odk_config
    - form_id
    - db
    - destination_action
    - existing_db_table_name
    - db_table_name
    - attachment_root
  properties:
    attachment_root:
      type: string
      description: >-
        A path where ODK attachments will be stored. Attachment files will be
        stored in the following directory schema: 
        `{attachment_root}/{db_table_name}/attachments/{filename}`
      default: /persistent-storage/datalake
      originalType: string
    db:
      type: object
      description: A database connection for storing tabular data.
      default: null
      format: resource-postgresql
    destination_action:
      type: string
      description: >-
        Write into a table that already exists, or create a new one.
        Choosing an existing dataset avoids a typo creating a second table.
      default: create_new_dataset
      disableCreate: true
      enum:
        - create_new_dataset
        - use_existing_dataset
      enumLabels:
        create_new_dataset: Create new dataset
        use_existing_dataset: Use existing dataset
      originalType: enum
      title: Dataset
    existing_db_table_name:
      type: object
      description: >-
        Existing table to write into; also used as the datalake subdirectory.
        The list refreshes from `db` and omits connector sidecar tables
        (`__columns`, `__labels`, `__metadata`).
      default: null
      format: dynselect-existing_db_table_name
      nullable: true
      showExpr: "fields.destination_action == 'use_existing_dataset'"
      title: Existing dataset
    db_table_name:
      type: string
      description: >-
        Name of the new database table where the form data will be stored.
        Also used as the datalake subdirectory.
      default: null
      nullable: true
      originalType: string
      pattern: '^.{1,54}$'
      showExpr: "fields.destination_action != 'use_existing_dataset'"
      title: New dataset name
    form_id:
      type: string
      description: >-
        The unique identifier of the form to fetch submissions from. This is the
        name  of the form as can be found in the ODK Central web interface.
      default: null
      originalType: string
    odk:
      type: object
      description: >-
        An ODK Central server URL, username, password, and project ID for an ODK
        project.
      default: null
      format: resource-odk
      originalType: string
  required:
    - odk
    - form_id
    - db
