summary: 'Sensing Clues: Fetch Observations'
description: >-
  Uses the SensingClues Focus API (via sensingcluespy) to download observations
  for one or more groups, saving raw JSON and CSV to the datalake and
  PostgreSQL.
lock: '!inline f/connectors/sensingclues/sensingclues_observations.script.lock'
concurrency_time_window_s: 0
kind: script
schema:
  $schema: 'https://json-schema.org/draft/2020-12/schema'
  type: object
  order:
    - username
    - password
    - groups
    - date_from
    - date_until
    - db
    - db_table_name
    - attachment_root
  properties:
    attachment_root:
      type: string
      description: >-
        A path where Sensing Clues data files will be stored. Files will be
        stored as: `{attachment_root}/{db_table_name}/...`
      default: /persistent-storage/datalake
      originalType: string
    date_from:
      type: string
      description: >-
        Optional inclusive start date to filter observations, as YYYY-MM-DD
        (UTC).
      default: null
      originalType: string
    date_until:
      type: string
      description: 'Optional inclusive end date to filter observations, as YYYY-MM-DD (UTC).'
      default: null
      originalType: string
    db:
      type: object
      description: A database connection for storing tabular data.
      default: null
      format: resource-postgresql
    db_table_name:
      type: string
      description: The name of the database table where observations will be stored.
      default: null
      originalType: string
      pattern: '^.{1,54}$'
    groups:
      type: array
      description: >-
        Sensing Clues group names to fetch, e.g. `focus-project-1234`. See the
        connector README for how to list groups available to the account.
      default: null
      items:
        type: string
        enum: null
      originalType: 'string[]'
    password:
      type: string
      description: Sensing Clues Focus password.
      default: null
      originalType: string
    username:
      type: string
      description: Sensing Clues Focus username.
      default: null
      originalType: string
  required:
    - username
    - password
    - groups
    - db
    - db_table_name
