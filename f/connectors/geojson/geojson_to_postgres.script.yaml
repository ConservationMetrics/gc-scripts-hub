summary: 'GeoJSON: Upload to Postgres'
description: This script uploads GeoJSON data to a Postgres database.
lock: '!inline f/connectors/geojson/geojson_to_postgres.script.lock'
concurrency_time_window_s: 0
kind: script
schema:
  $schema: 'https://json-schema.org/draft/2020-12/schema'
  type: object
  order:
    - geojson_path
    - db
    - destination_action
    - existing_db_table_name
    - db_table_name
    - delete_geojson_file
    - attachment_root
  properties:
    attachment_root:
      type: string
      description: A path where to find the GeoJSON file.
      default: /persistent-storage/datalake/
      originalType: string
    db:
      type: object
      description: A database connection for storing tabular data.
      default: null
      format: resource-postgresql
    destination_action:
      type: string
      description: >-
        Write into a table that already exists, or create a new one.
        Choosing an existing dataset avoids a typo creating a second table.
      default: create_new_dataset
      disableCreate: true
      enum:
        - create_new_dataset
        - use_existing_dataset
      enumLabels:
        create_new_dataset: Create new dataset
        use_existing_dataset: Use existing dataset
      originalType: enum
      title: Dataset
    existing_db_table_name:
      type: object
      description: >-
        Existing public table to write into. The list refreshes from `db`
        and omits connector sidecar tables (`__columns`, `__labels`,
        `__metadata`).
      default: null
      format: dynselect-existing_db_table_name
      nullable: true
      showExpr: "fields.destination_action == 'use_existing_dataset'"
      title: Existing dataset
    db_table_name:
      type: string
      description: Name of the new database table where the data will be stored.
      default: null
      nullable: true
      originalType: string
      pattern: '^.{1,54}$'
      showExpr: "fields.destination_action != 'use_existing_dataset'"
      title: New dataset name
    delete_geojson_file:
      type: boolean
      description: Whether to delete the GeoJSON file file after processing.
      default: false
    geojson_path:
      type: string
      description: 'The path to the GeoJSON file to upload, including the filename.'
      default: null
      originalType: string
  required:
    - db
    - geojson_path
