summary: 'EpiCollect5: Fetch Survey Entries'
description: >-
  Uses the EpiCollect5 REST API to download project metadata, survey entries,
  and media attachments
lock: '!inline f/connectors/epicollect/epicollect_pull.script.lock'
concurrency_time_window_s: 0
kind: script
schema:
  $schema: 'https://json-schema.org/draft/2020-12/schema'
  type: object
  order:
    - project_slug
    - client_id
    - client_secret
    - db
    - destination_action
    - existing_db_table_name
    - db_table_name
    - attachment_root
  properties:
    attachment_root:
      type: string
      description: >-
        A path where EpiCollect5 attachments will be stored. Files will be
        stored as: `{attachment_root}/{db_table_name}/attachments/{filename}`
      default: /persistent-storage/datalake
      originalType: string
    client_id:
      type: integer
      description: >-
        Client ID for a project App. Only required for private projects. Create
        a project App in the Apps tab to obtain this. See
        https://developers.epicollect.net/api-authentication/create-client-app
      default: null
      originalType: integer
    client_secret:
      type: string
      description: >-
        Client Secret for a project App. Only required for private projects.
        Create a project App in the Apps tab to obtain this.
      default: null
      originalType: string
    db:
      type: object
      description: A database connection for storing tabular data.
      default: null
      format: resource-postgresql
    destination_action:
      type: string
      description: >-
        Write into a table that already exists, or create a new one.
        Choosing an existing dataset avoids a typo creating a second table.
      default: create_new_dataset
      disableCreate: true
      enum:
        - create_new_dataset
        - use_existing_dataset
      enumLabels:
        create_new_dataset: Create new dataset
        use_existing_dataset: Use existing dataset
      originalType: enum
      title: Dataset
    existing_db_table_name:
      type: object
      description: >-
        Existing public table to write into. The list refreshes from `db`
        and omits connector sidecar tables (`__columns`, `__labels`,
        `__metadata`).
      default: null
      format: dynselect-existing_db_table_name
      nullable: true
      showExpr: "fields.destination_action == 'use_existing_dataset'"
      title: Existing dataset
    db_table_name:
      type: string
      description: >-
        Name of the new database table where entries will be stored.
        Also used as the datalake subdirectory.
      default: null
      nullable: true
      originalType: string
      pattern: '^.{1,54}$'
      showExpr: "fields.destination_action != 'use_existing_dataset'"
      title: New dataset name
    project_slug:
      type: string
      description: >-
        The project slug, found in the project URL
        (https://five.epicollect.net/project/{slug}) or on the project's API
        tab.
      default: null
      originalType: string
  required:
    - project_slug
    - db
