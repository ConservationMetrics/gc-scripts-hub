summary: 'GBIF: Save occurrence statistics'
description: >-
  Part of the GBIF download Flow. Saves dataset, publisher, year, species, and
  basis-of-record counts for the same area. Do not run this script on its own;
  open `GBIF: Download occurrences` instead.
lock: '!inline f/connectors/gbif/gbif_pull_statistics.script.lock'
kind: script
schema:
  $schema: 'https://json-schema.org/draft/2020-12/schema'
  type: object
  order:
    - bounding_box
    - db
    - db_table_name
  properties:
    bounding_box:
      type: string
      description: >-
        Area to download as `[[west, south], [east, north]]`. The area must be
        no larger than approximately 35,000 km2. Find these values with Mapbox
        Location Helper: https://labs.mapbox.com/location-helper
      default: null
    db:
      type: object
      description: PostgreSQL database where the statistics table is saved.
      default: null
      format: resource-postgresql
    db_table_name:
      type: string
      description: >-
        Occurrence table name. Counts are saved in `{name}__statistics`
        as facet, key, label, and count.
      default: null
      originalType: string
      pattern: '^.{1,51}$'
  required:
    - bounding_box
    - db
    - db_table_name
