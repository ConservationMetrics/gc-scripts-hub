summary: "GBIF: Save occurrence statistics"
description: >-
  Counts dataset, publisher, year, species, and basis-of-record values for
  every occurrence GBIF indexes in an area, and replaces that table. This is a
  separate connector script from `GBIF: Download occurrences`, which downloads 
  all individual occurrences and saves them to a database table.
lock: "!inline f/connectors/gbif/gbif_pull_statistics.script.lock"
kind: script
schema:
  $schema: "https://json-schema.org/draft/2020-12/schema"
  type: object
  order:
    - bounding_box
    - db
    - destination_action
    - existing_db_table_name
    - db_table_name
  properties:
    bounding_box:
      type: string
      description: >-
        Area to summarize as `[[west, south], [east, north]]`. The area must be
        no larger than approximately 35,000 km2. Find these values with Mapbox
        Location Helper: https://labs.mapbox.com/location-helper
      default: null
    db:
      type: object
      description: PostgreSQL database where the statistics table is saved.
      default: null
      format: resource-postgresql
    destination_action:
      type: string
      description: >-
        Enter a dataset name, or choose an existing dataset.
        Creates the dataset if needed; updates it if it already exists.
      default: create_new_dataset
      disableCreate: true
      enum:
        - create_new_dataset
        - use_existing_dataset
      enumLabels:
        create_new_dataset: Enter dataset name
        use_existing_dataset: Use existing dataset
      originalType: enum
      title: Dataset
    existing_db_table_name:
      type: object
      description: >-
        Existing public table to replace with facet counts. The list refreshes
        from `db` and omits connector sidecar tables (`__columns`, `__labels`,
        `__metadata`).
      default: null
      format: dynselect-existing_db_table_name
      nullable: true
      showExpr: "fields.destination_action == 'use_existing_dataset'"
      title: Existing dataset
    db_table_name:
      type: string
      description: >-
        Creates the dataset if needed; updates it if it already exists.
        Counts are saved with columns `facet`, `key`, `label`, and `count`.
      default: null
      nullable: true
      originalType: string
      pattern: "^.{1,63}$"
      showExpr: "fields.destination_action != 'use_existing_dataset'"
      title: Dataset name
  required:
    - bounding_box
    - db
