summary: 'GBIF: Download and import occurrences'
description: >-
  Part of the GBIF download Flow. Saves a completed download to PostgreSQL. Do
  not run this script on its own; open `GBIF: Download occurrences` instead.
lock: '!inline f/connectors/gbif/gbif_pull_occurrences.script.lock'
kind: script
schema:
  $schema: 'https://json-schema.org/draft/2020-12/schema'
  type: object
  order:
    - download_key
    - db
    - destination_action
    - existing_db_table_name
    - db_table_name
    - attachment_root
  properties:
    attachment_root:
      type: string
      description: Folder where downloaded files and supporting information are saved.
      default: /persistent-storage/datalake
      originalType: string
    db:
      type: object
      description: PostgreSQL database where occurrence records are saved.
      default: null
      format: resource-postgresql
    destination_action:
      type: string
      description: >-
        Write into a table that already exists, or create a new one.
        Choosing an existing dataset avoids a typo creating a second table.
      default: create_new_dataset
      disableCreate: true
      enum:
        - create_new_dataset
        - use_existing_dataset
      enumLabels:
        create_new_dataset: Create new dataset
        use_existing_dataset: Use existing dataset
      originalType: enum
      title: Dataset
    existing_db_table_name:
      type: object
      description: >-
        Existing table to write into; also used as the datalake subdirectory.
        The list refreshes from `db` and omits connector sidecar tables
        (`__columns`, `__labels`, `__metadata`).
      default: null
      format: dynselect-existing_db_table_name
      nullable: true
      showExpr: "fields.destination_action == 'use_existing_dataset'"
      title: Existing dataset
    db_table_name:
      type: string
      description: >-
        Name of the new table. This is also used as the download folder name.
        The last import time is saved in `{name}__metadata`.
      default: null
      nullable: true
      originalType: string
      pattern: '^.{1,53}$'
      showExpr: "fields.destination_action != 'use_existing_dataset'"
      title: New dataset name
    download_key:
      type: string
      description: ID assigned to the download by GBIF.
      default: null
      originalType: string
  required:
    - download_key
    - db
