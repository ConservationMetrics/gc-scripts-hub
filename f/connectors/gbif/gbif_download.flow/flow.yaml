summary: "GBIF: Download occurrences"
description: >-
  Downloads GBIF occurrence records for an area and saves them to PostgreSQL.
  Use it for a first download or to update existing data. GBIF can take time to
  prepare the file, so this Flow checks every minute for up to 24 hours.
value:
  modules:
    - id: submit
      value:
        path: f/connectors/gbif/gbif_submit_download
        type: script
        is_trigger: false
        input_transforms:
          bounding_box:
            expr: flow_input.bounding_box
            type: javascript
          gbif_account:
            expr: flow_input.gbif_account
            type: javascript
          max_months_lookback:
            expr: flow_input.max_months_lookback
            type: javascript
      continue_on_error: false
    - id: wait_for_download
      value:
        type: whileloopflow
        modules:
          - id: delay
            sleep:
              expr: "flow_input.iter.index === 0 ? 0 : 60"
              type: javascript
            value:
              type: identity
          - id: check
            retry:
              retry_if:
                expr: >-
                  error.message && error.message.startsWith('retryable GBIF
                  status check failure')
              exponential:
                seconds: 5
                attempts: 3
                multiplier: 2
                random_factor: 20
            value:
              path: f/connectors/gbif/gbif_check_download
              type: script
              is_trigger: false
              input_transforms:
                deadline:
                  expr: results.submit.deadline
                  type: javascript
                download_key:
                  expr: results.submit.download_key
                  type: javascript
            stop_after_if:
              expr: result.succeeded === true
              skip_if_stopped: false
        skip_failures: false
      continue_on_error: false
    - id: ingest
      value:
        path: f/connectors/gbif/gbif_pull_occurrences
        type: script
        is_trigger: false
        input_transforms:
          db:
            expr: flow_input.db
            type: javascript
          download_key:
            expr: results.submit.download_key
            type: javascript
          destination_action:
            expr: flow_input.destination_action
            type: javascript
          existing_db_table_name:
            expr: flow_input.existing_db_table_name
            type: javascript
          db_table_name:
            expr: flow_input.db_table_name
            type: javascript
          attachment_root:
            expr: flow_input.attachment_root
            type: javascript
      continue_on_error: false
schema:
  $schema: "https://json-schema.org/draft/2020-12/schema"
  type: object
  order:
    - gbif_account
    - bounding_box
    - max_months_lookback
    - db
    - destination_action
    - existing_db_table_name
    - db_table_name
    - attachment_root
  properties:
    attachment_root:
      type: string
      description: Folder where downloaded files and supporting information are saved.
      default: /persistent-storage/datalake
    bounding_box:
      type: string
      description: >-
        Area to download as `[[west, south], [east, north]]`. The area must be
        no larger than approximately 35,000 km2. Find these values with Mapbox
        Location Helper: https://labs.mapbox.com/location-helper
    db:
      type: object
      description: PostgreSQL database where occurrence records are saved.
      format: resource-postgresql
    destination_action:
      type: string
      description: >-
        Enter a dataset name, or choose an existing dataset.
        Creates the dataset if needed; updates it if it already exists.
      default: create_new_dataset
      disableCreate: true
      enum:
        - create_new_dataset
        - use_existing_dataset
      enumLabels:
        create_new_dataset: Enter dataset name
        use_existing_dataset: Use existing dataset
      title: Dataset
    existing_db_table_name:
      type: object
      description: >-
        Existing table to write into; also used as the datalake subdirectory.
        The list refreshes from `db` and omits connector sidecar tables
        (`__columns`, `__labels`, `__metadata`).
      default: null
      format: dynselect-existing_db_table_name
      nullable: true
      showExpr: "fields.destination_action == 'use_existing_dataset'"
      title: Existing dataset
    db_table_name:
      type: string
      description: >-
        Creates the dataset if needed; updates it if it already exists.
        Also used as the download folder. The last import time is saved in `{name}__metadata`.
      nullable: true
      pattern: "^.{1,53}$"
      showExpr: "fields.destination_action != 'use_existing_dataset'"
      title: Dataset name
    gbif_account:
      type: object
      description: GBIF account with a username (not email address) and password.
      format: resource-gbif
    max_months_lookback:
      type: integer
      description: >-
        Only include records processed by GBIF within this many months. This
        uses LAST_INTERPRETED: when the record last changed in GBIF, not its
        observation date or the publisher's last update.
      default: null
      minimum: 0
      nullable: true
  required:
    - gbif_account
    - bounding_box
    - db
  x-windmill-dyn-select-lang: python3
  x-windmill-dyn-select-code: |
    from f.common_logic.db_operations import (
        existing_db_table_name as list_dataset_tables,
    )


    def existing_db_table_name(db=None):
        return list_dataset_tables(db)
