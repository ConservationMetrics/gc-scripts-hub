summary: 'GBIF: Check download status'
description: Single status check for the GBIF Flow polling loop; it never sleeps
  or submits a download.
lock: '!inline f/connectors/gbif/gbif_check_download.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - download_key
    - deadline
  properties:
    deadline:
      type: string
      description: Absolute ISO-8601 deadline returned by the submission step.
      default: null
      originalType: string
    download_key:
      type: string
      description: GBIF download key returned by the submission step.
      default: null
      originalType: string
  required:
    - download_key
    - deadline
