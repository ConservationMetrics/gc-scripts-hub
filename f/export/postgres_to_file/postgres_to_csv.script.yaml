summary: 'Export: Postgres to CSV'
description: >-
  This script connects to a PostgreSQL database, retrieves all entries from a
  specified table, and converts the data into a CSV file.
lock: '!inline f/export/postgres_to_file/postgres_to_csv.script.lock'
concurrency_time_window_s: 0
kind: script
schema:
  $schema: 'https://json-schema.org/draft/2020-12/schema'
  type: object
  order:
    - db
    - existing_db_table_name
    - storage_path
  properties:
    db:
      type: object
      description: A database connection for storing tabular data.
      default: null
      format: resource-postgresql
    existing_db_table_name:
      type: object
      description: >-
        Existing public table to export. The list refreshes from `db` and
        omits connector sidecar tables (`__columns`, `__labels`, `__metadata`).
      default: null
      format: dynselect-existing_db_table_name
      nullable: true
      title: Dataset
    storage_path:
      type: string
      description: >-
        The path to the directory where the CSV file will be stored. The file
        will be named after the database table name.
      default: /persistent-storage/datalake/exports
      originalType: string
  required:
    - db
    - existing_db_table_name
