version: 2.1



workflows:
  run-tests:
    jobs:
      - test
      - test-dataset-importer-app

jobs:
  test-dataset-importer-app:
    docker:
      - image: cimg/node:22.22
    steps:
      - checkout
      - run:
          name: Install Dataset Importer dependencies
          command: npm ci
          working_directory: f/apps/gc_dataset_importer_poc.raw_app
      - run:
          name: Validate Dataset Importer app
          command: npm run typecheck && npm run format:check && npm run lint && npm test && npm run lint:windmill && npm audit
          working_directory: f/apps/gc_dataset_importer_poc.raw_app

  test:
    resource_class: medium
    docker:
      - image: cimg/python:3.11.10

    steps:
      - checkout
      - run:
          name: Install PostgreSQL 14 server to test against
          command: |
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends postgresql-14
      - run:
          name: Install tox for Python 3.11
          command: |
            python -m pip install --upgrade "pip>=26.1"
            pip install tox~=4.18
      - run:
          name: Run tests
          command: tox -p 3 -- -v
          environment:
            PIP_UPLOADED_PRIOR_TO: P7D
