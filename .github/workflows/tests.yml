name: Tests

on:
  push:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      # We set Python 3.11 as the default version for CI because it's the
      # version we use for our Windmill instances (as "latest stable").
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.11.10

      # If we want to get rid of this step, convert our scripts to use
      # SqlAlchemy so tests would use SQLite.
      - name: Install PostgreSQL
        run: sudo apt-get update && sudo apt-get install --yes postgresql

      - name: Install tox
        run: |
          python -m pip install --upgrade "pip>=26.1"
          pip install tox~=4.18 tox-docker~=5.0

      - name: Run tests
        run: tox -- -v
        env:
          PIP_UPLOADED_PRIOR_TO: P7D
          TOX_DOCKER_GATEWAY: localhost
